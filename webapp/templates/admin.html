<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Smart Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar glass">
        <div class="logo">
            <h2 class="brand-pill">
                <i class="fas fa-shield-halved"></i> ADMIN
            </h2>
        </div>
        <div class="user-info">
            <span>Welcome, <strong>{{ user.username }}</strong> ({{ user.role }})</span>
            <a href="/" style="margin-left: 20px; color: var(--text); text-decoration: none;"><i class="fas fa-house"></i></a>
            <a href="/logout" style="margin-left: 16px; color: var(--danger); text-decoration: none;"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </nav>

    <div class="container">
        <div class="grid" style="grid-template-columns: 1.2fr 1fr; align-items: start;">
            <!-- Active Alerts -->
            <div class="device-card glass">
                <h3><i class="fas fa-circle-exclamation"></i> Cảnh báo đang hoạt động</h3>
                <div style="margin-top: 10px; display:flex; justify-content:flex-end;">
                    <button class="btn btn-primary" onclick="loadActiveAlerts()"><i class="fas fa-sync"></i> Làm mới</button>
                </div>

                <div class="table-container" style="margin-top: 15px;">
                    <table>
                        <thead>
                        <tr>
                            <th>Thời gian</th>
                            <th>Loại</th>
                            <th>Level</th>
                            <th>Message</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="active-alerts-body">
                        <tr><td colspan="5" style="color: var(--text-muted);">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Threshold Config -->
            <div class="device-card glass">
                <h3><i class="fas fa-sliders"></i> Cấu hình ngưỡng</h3>
                <div style="margin-top: 6px; color: var(--text-muted); font-size: 0.95rem;">
                    Admin có thể chỉnh giá trị, hệ thống sẽ áp dụng ngay.
                </div>

                <div class="table-container" style="margin-top: 15px;">
                    <table>
                        <thead>
                        <tr>
                            <th>Key</th>
                            <th>Value</th>
                        </tr>
                        </thead>
                        <tbody id="thresholds-body"></tbody>
                    </table>
                </div>

                <div style="margin-top: 16px;">
                    <button class="btn btn-primary" onclick="saveThresholds()"><i class="fas fa-save"></i> Lưu ngưỡng</button>
                </div>
            </div>
        </div>

        <!-- Accounts -->
        <div class="device-card glass" style="margin-top: 25px;">
            <h3><i class="fas fa-users-gear"></i> Quản lý tài khoản</h3>
            <div style="display:flex; gap: 12px; flex-wrap: wrap; margin-top: 10px;">
                <div style="flex: 1; min-width: 200px;">
                    <label style="color: var(--text-muted); font-size: 0.9rem;">Username</label>
                    <input id="acc-username" class="glass"
                           style="width: 100%; padding: 12px; margin-top: 5px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px;">
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label style="color: var(--text-muted); font-size: 0.9rem;">Password</label>
                    <input id="acc-password" type="password" class="glass"
                           style="width: 100%; padding: 12px; margin-top: 5px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px;">
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label style="color: var(--text-muted); font-size: 0.9rem;">Role</label>
                    <select id="acc-role" class="glass"
                            style="width: 100%; padding: 12px; margin-top: 5px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px;">
                        <option value="viewer">viewer</option>
                        <option value="user">user</option>
                        <option value="admin">admin</option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label style="color: var(--text-muted); font-size: 0.9rem;">Full name (optional)</label>
                    <input id="acc-full-name" class="glass"
                           style="width: 100%; padding: 12px; margin-top: 5px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px;">
                </div>
                <div style="display:flex; align-items:flex-end;">
                    <button class="btn btn-primary" onclick="addAccount()"><i class="fas fa-user-plus"></i> Tạo</button>
                </div>
            </div>

            <div class="table-container" style="margin-top: 15px;">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Full name</th>
                        <th>Active</th>
                        <th>Last login</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody id="accounts-body">
                    <tr><td colspan="7" style="color: var(--text-muted);">Đang tải...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadActiveAlerts() {
            const tbody = document.getElementById('active-alerts-body');
            tbody.innerHTML = '<tr><td colspan="5" style="color: var(--text-muted);">Đang tải...</td></tr>';

            const resp = await fetch('/api/alerts/active');
            const alerts = await resp.json();

            tbody.innerHTML = '';
            if (!alerts || alerts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="color: var(--text-muted);">Không có cảnh báo đang hoạt động</td></tr>';
                return;
            }

            alerts.forEach(a => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${a.created_at ?? ''}</td>
                    <td>${a.alert_type ?? ''}</td>
                    <td><span class="status-badge ${a.level === 'CANH_BAO' ? 'badge-warning' : 'badge-danger'}">${a.level ?? ''}</span></td>
                    <td>${a.message ?? ''}</td>
                    <td>
                        <button class="btn btn-primary" style="padding: 8px 14px;" onclick="resolveAlert(${a.id})">
                            <i class="fas fa-check"></i> Resolve
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function resolveAlert(alertId) {
            const ok = confirm('Resolve cảnh báo này?');
            if (!ok) return;

            const resp = await fetch('/api/alerts/resolve', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({alert_id: alertId})
            });
            const result = await resp.json();
            if (!result.success) {
                alert('Lỗi: ' + (result.message || 'unknown'));
                return;
            }
            await loadActiveAlerts();
        }

        async function loadThresholds() {
            const tbody = document.getElementById('thresholds-body');
            tbody.innerHTML = '';

            const resp = await fetch('/api/thresholds');
            const rows = await resp.json();

            Object.keys(rows).forEach(key => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color: var(--text-muted); font-weight: 600;">${key}</td>
                    <td>
                        <input id="th-${key}" class="glass"
                               style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px;"
                               value="${rows[key]}">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function saveThresholds() {
            const rows = document.getElementById('thresholds-body').children;
            const config = {};

            // gather keys from DOM input ids
            const inputs = document.querySelectorAll('#thresholds-body input');
            inputs.forEach(input => {
                const id = input.id; // th-KEY
                const key = id.replace(/^th-/, '');
                config[key] = input.value;
            });

            const resp = await fetch('/api/thresholds/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({config})
            });
            const result = await resp.json();
            if (!result.success) {
                alert('Lỗi: ' + (result.message || 'unknown'));
                return;
            }
            alert('Đã lưu ngưỡng!');
        }

        async function loadAccounts() {
            const tbody = document.getElementById('accounts-body');
            tbody.innerHTML = '<tr><td colspan="7" style="color: var(--text-muted);">Đang tải...</td></tr>';

            const resp = await fetch('/api/accounts');
            const accounts = await resp.json();

            tbody.innerHTML = '';
            if (!accounts || accounts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="color: var(--text-muted);">Không có tài khoản</td></tr>';
                return;
            }

            accounts.forEach(acc => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${acc.id}</td>
                    <td>${acc.username}</td>
                    <td>${acc.role}</td>
                    <td>${acc.full_name ?? ''}</td>
                    <td>${acc.is_active ? 'Yes' : 'No'}</td>
                    <td>${acc.last_login ?? ''}</td>
                    <td>
                        <button class="btn btn-primary" style="padding: 8px 14px; margin-right: 8px;" onclick="deactivateAccount(${acc.id})">
                            <i class="fas fa-ban"></i> Deactivate
                        </button>
                        <button class="btn btn-primary" style="padding: 8px 14px;" onclick="changePassword(${acc.id})">
                            <i class="fas fa-key"></i> Đổi MK
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function addAccount() {
            const username = document.getElementById('acc-username').value.trim();
            const password = document.getElementById('acc-password').value.trim();
            const role = document.getElementById('acc-role').value;
            const fullName = document.getElementById('acc-full-name').value.trim();

            if (!username || !password) {
                alert('Thiếu username/password');
                return;
            }

            const resp = await fetch('/api/accounts/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password, role, full_name: fullName || null})
            });
            const result = await resp.json();
            if (!result.success) {
                alert('Lỗi: ' + (result.message || 'unknown'));
                return;
            }

            document.getElementById('acc-username').value = '';
            document.getElementById('acc-password').value = '';
            document.getElementById('acc-full-name').value = '';
            await loadAccounts();
        }

        async function deactivateAccount(accountId) {
            const ok = confirm('Deactive tài khoản này?');
            if (!ok) return;

            const resp = await fetch('/api/accounts/deactivate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({account_id: accountId})
            });
            const result = await resp.json();
            if (!result.success) {
                alert('Lỗi: ' + (result.message || 'unknown'));
                return;
            }
            await loadAccounts();
        }

        async function changePassword(accountId) {
            const newPass = prompt('Nhập mật khẩu mới:');
            if (!newPass) return;

            const resp = await fetch('/api/accounts/change-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({account_id: accountId, new_password: newPass})
            });
            const result = await resp.json();
            if (!result.success) {
                alert('Lỗi: ' + (result.message || 'unknown'));
                return;
            }
            alert('Đã đổi mật khẩu!');
        }

        // init
        loadActiveAlerts();
        loadThresholds();
        loadAccounts();
    </script>
</body>
</html>
